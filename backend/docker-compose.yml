services:
  backend:
    build: .
    restart: unless-stopped
    environment:
      API_KEYS: ${API_KEYS:?Set API_KEYS in environment}
      DATA_DIR: /data
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-500}
      MAX_QUEUE_SIZE: ${MAX_QUEUE_SIZE:-50}
      JOB_DEADLINE_SEC: ${JOB_DEADLINE_SEC:-240}
      RESULT_TTL_HOURS: ${RESULT_TTL_HOURS:-24}
      WORKER_ENABLED: "false"
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - backend_data:/data
    depends_on:
      - worker
  worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.worker_process"]
    environment:
      DATA_DIR: /data
      JOB_DEADLINE_SEC: ${JOB_DEADLINE_SEC:-240}
      RESULT_TTL_HOURS: ${RESULT_TTL_HOURS:-24}
    volumes:
      - backend_data:/data
    # Add a GPU reservation here when deploying on a host with NVIDIA Container Toolkit.
volumes:
  backend_data:
